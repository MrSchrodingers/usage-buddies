extra-keys = [[ \
  {key:'KEYBOARD', display:'TECLA'}, \
  {macro:'CTRL b w', display:'MENU'}, \
  {macro:'CTRL b c', display:'+SH'}, \
  {macro:'CTRL b p', display:'ANT'}, \
  {macro:'CTRL b n', display:'PROX'}, \
  {key:'ENTER', display:'OK'}, \
  {macro:'CTRL b z', display:'TELA'}, \
  {macro:'CTRL b d', display:'SAIR'} \
